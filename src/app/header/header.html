<header class="bar on-dark" [class.is-solid]="solid() || open()">
  <div class="container bar__inner">
    <a class="brand" href="#top" (click)="close()" [attr.aria-label]="restaurant.name + ' ' + restaurant.descriptor + ', back to top'">
      <svg class="brand__mark" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="20" cy="20" r="9" fill="none" stroke="currentColor" stroke-width="3"/>
        <circle cx="20" cy="20" r="2.6" fill="currentColor"/>
      </svg>
      <span class="brand__name">{{ restaurant.name }}</span>
      <span class="brand__sub">{{ restaurant.descriptor }}</span>
    </a>

    <nav id="site-nav" class="nav" [class.is-open]="open()" aria-label="Main">
      @for (l of links; track l.id) {
        <a [href]="'#' + l.id" [class.is-active]="spy.active() === l.id" [attr.aria-current]="spy.active() === l.id ? 'true' : null" (click)="close()">{{ l.label }}</a>
      }
      <a class="btn nav__cta" href="#reserve" (click)="close()">Book a table</a>
    </nav>

    <button class="burger" type="button" (click)="toggle()" [attr.aria-expanded]="open()" aria-controls="site-nav" aria-label="Menu">
      <span></span><span></span>
    </button>
  </div>
</header>
