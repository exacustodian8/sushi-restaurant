<section class="section gallery" id="gallery" appSpy="gallery">
  <div class="container">
    <header class="gallery__head">
      <div>
        <p class="eyebrow" appReveal>From the counter</p>
        <h2 appReveal [revealDelay]="80">What the evening looks like.</h2>
      </div>
    </header>

    <ul class="grid">
      @for (p of photos; track p.file; let i = $index) {
        <li [class]="'cell cell--' + (i + 1)" appReveal [revealDelay]="(i % 3) * 90">
          <button type="button" (click)="open(p)" [attr.aria-label]="'Enlarge photo: ' + p.alt">
            <img [src]="p.file" [alt]="p.alt" loading="lazy">
          </button>
        </li>
      }
    </ul>
  </div>

  <dialog #dialog class="lightbox" (click)="backdropClose($event)" aria-label="Photo viewer">
    @if (current(); as p) {
      <figure>
        <img [src]="p.file" [alt]="p.alt">
        <figcaption>{{ p.alt }}</figcaption>
      </figure>
    }
    <form method="dialog"><button class="lightbox__close" aria-label="Close photo">&times;</button></form>
  </dialog>
</section>
